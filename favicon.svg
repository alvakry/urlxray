<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background with subtle red glow -->
  <rect width="64" height="64" rx="10" fill="#000000"/>

  <!-- Red glow halo behind lens -->
  <circle cx="26" cy="26" r="17" fill="rgba(226,2,58,0.12)"/>

  <!-- Lens crosshair lines inside circle (X-ray grid) -->
  <line x1="26" y1="10" x2="26" y2="42" stroke="#e2023a" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <line x1="10" y1="26" x2="42" y2="26" stroke="#e2023a" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2,3"/>
  <!-- Diagonal scan lines -->
  <line x1="14" y1="14" x2="38" y2="38" stroke="#e2023a" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2,4"/>
  <line x1="38" y1="14" x2="14" y2="38" stroke="#e2023a" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2,4"/>

  <!-- Lens outer ring (main circle) -->
  <circle cx="26" cy="26" r="16" fill="none" stroke="#e2023a" stroke-width="3.5"/>

  <!-- Inner lens ring (double ring effect) -->
  <circle cx="26" cy="26" r="11" fill="none" stroke="#e2023a" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="26" cy="26" r="2.5" fill="#e2023a"/>

  <!-- Handle — thick, angled, with square cap -->
  <line x1="38" y1="38" x2="56" y2="56" stroke="#e2023a" stroke-width="5" stroke-linecap="square"/>

  <!-- Handle accent notch -->
  <line x1="41" y1="39" x2="44" y2="42" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg>
